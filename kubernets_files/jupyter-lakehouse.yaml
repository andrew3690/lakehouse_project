apiVersion: apps/v1
kind: Deployment
metadata:
  name: jupyter-lakehouse
  labels:
    app: jupyter-lakehouse
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jupyter-lakehouse
  template:
    metadata:
      labels:
        app: jupyter-lakehouse
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      serviceAccountName: spark
      containers:
      - name: jupyter
        image: lakehouse-spark:v1
        imagePullPolicy: Never
        # CORREÇÃO AQUI: Apontando para o volume interno
        command: ["/bin/bash", "-c", "jupyter lab --ip=0.0.0.0 --port=8888 --no-browser --allow-root --NotebookApp.token='' --notebook-dir=/opt/spark/work"]
        
        env:
        - name: SPARK_MASTER_HOST
          value: "spark-master-service"
        - name: SPARK_MASTER_PORT
          value: "7077"
        - name: METASTORE_HOST
          value: "10.43.47.107"
        - name: METASTORE_PORT
          value: "5432"
        - name: METASTORE_DB
          value: "hive_metastore"
        - name: METASTORE_USER
          value: "postgres"
        - name: METASTORE_PASSWORD
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: METASTORE_PASSWORD
        - name: S3_ENDPOINT
          value: "http://192.168.15.9:9000"
        - name: WAREHOUSE_DIR
          value: "s3a://lakehouse/warehouse/"
        - name: AWS_ACCESS_KEY_ID
          value: "admin"
        - name: AWS_SECRET_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: lakehouse-secrets
              key: MINIO_SECRET_KEY

        ports:
        - containerPort: 8888
        - containerPort: 4040

        volumeMounts:
        - name: notebook-storage
          mountPath: /opt/spark/work
        - name: spark-conf
          mountPath: /opt/spark/conf/spark-defaults.conf
          subPath: spark-defaults.conf

      volumes:
      - name: notebook-storage
        persistentVolumeClaim:
          claimName: spark-pvc
      - name: spark-conf
        configMap:
          name: spark-config
