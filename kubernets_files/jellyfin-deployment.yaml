apiVersion: apps/v1
kind: Deployment
metadata:
  name: jellyfin
  labels:
    app: jellyfin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: jellyfin
  template:
    metadata:
      labels:
        app: jellyfin
    spec:
      containers:
      - name: jellyfin
        image: jellyfin/jellyfin:latest
        imagePullPolicy: Always
        env:
        - name: TZ
          value: "America/Sao_Paulo"
        ports:
        - containerPort: 8096
          name: http
          protocol: TCP
        volumeMounts:
        - name: jellyfin-config
          mountPath: /config
        - name: jellyfin-cache
          mountPath: /cache
        - name: media-storage
          mountPath: /media # <-- Lê a mesma pasta do torrent
      volumes:
      - name: jellyfin-config
        hostPath:
          path: /home/andre/lakehouse_project/jellyfin_data/config
          type: DirectoryOrCreate
      - name: jellyfin-cache
        hostPath:
          path: /home/andre/lakehouse_project/jellyfin_data/cache
          type: DirectoryOrCreate
      - name: media-storage
        hostPath:
          path: /home/andre/lakehouse_project/media_data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: jellyfin-service
spec:
  type: LoadBalancer
  selector:
    app: jellyfin
  ports:
    - protocol: TCP
      port: 8096
      targetPort: 8096
