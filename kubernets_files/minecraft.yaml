apiVersion: apps/v1
kind: Deployment
metadata:
  name: minecraft
  labels:
    app: minecraft
spec:
  replicas: 1
  selector:
    matchLabels:
      app: minecraft
  template:
    metadata:
      labels:
        app: minecraft
    spec:
      containers:
      - name: minecraft
        image: itzg/minecraft-server:latest
        imagePullPolicy: Always
        env:
        - name: EULA
          value: "TRUE"
        - name: TYPE
          value: "PAPER" # Versão otimizada
        - name: MEMORY
          value: "2G"    # Memória dedicada ao Java
        - name: DIFFICULTY
          value: "normal"
        ports:
        - containerPort: 25565
          name: game-tcp
          protocol: TCP
        volumeMounts:
        - name: minecraft-data
          mountPath: /data
      volumes:
      - name: minecraft-data
        hostPath:
          path: /home/andre/lakehouse_project/games_data/minecraft
          type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: minecraft-service
spec:
  type: LoadBalancer
  selector:
    app: minecraft
  ports:
    - protocol: TCP
      port: 25565
      targetPort: 25565
