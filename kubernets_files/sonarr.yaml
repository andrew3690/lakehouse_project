apiVersion: apps/v1
kind: Deployment
metadata:
  name: sonarr
  labels:
    app: sonarr
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sonarr
  template:
    metadata:
      labels:
        app: sonarr
    spec:
      containers:
      - name: sonarr
        image: lscr.io/linuxserver/sonarr:latest
        env:
        - name: PUID
          value: "1000"
        - name: PGID
          value: "1000"
        - name: TZ
          value: "America/Sao_Paulo"
        ports:
        - containerPort: 8989
          name: http
        volumeMounts:
        - name: sonarr-config
          mountPath: /config
        # O Pulo do Gato: Montamos a raiz /data para ele mover arquivos
        - name: media-storage
          mountPath: /data
      volumes:
      - name: sonarr-config
        hostPath:
          path: /home/andre/lakehouse_project/sonarr_data
          type: DirectoryOrCreate
      - name: media-storage
        hostPath:
          path: /home/andre/lakehouse_project/media_data
          type: DirectoryOrCreate
---
apiVersion: v1
kind: Service
metadata:
  name: sonarr-service
spec:
  type: LoadBalancer
  selector:
    app: sonarr
  ports:
    - protocol: TCP
      port: 8989
      targetPort: 8989
